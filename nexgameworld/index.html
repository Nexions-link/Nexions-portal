<!doctype html>
<html lang="ru">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a1c">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="description" content="NexGameWorld — сферическая фэнтезийная RPG. Играйте прямо на nexions.ru.">
<title>NexGameWorld · Играть</title>
<link rel="canonical" href="https://nexions.ru/nexgameworld/">
<!-- NexGameWorld mirror refresh for Alpha 0.6.41.1 (Raider GLB Atlas, quest unlocked at level 3). -->
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1519;color:#edd6a3}
body{position:fixed;inset:0;font:14px/1.5 Georgia,serif;overscroll-behavior:none}
#game{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#0b1519;touch-action:auto}
#loading{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at center,#294039,#0b1519);pointer-events:none}
#loading[hidden]{display:none!important}
#loading div{max-width:350px}
#loading strong{font-size:clamp(23px,7vw,40px);font-weight:400;letter-spacing:.035em}
#loading p{font:13px/1.6 system-ui,sans-serif;color:#bdbaae}
#notice{position:absolute;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:2;max-width:340px;margin:auto;padding:8px 11px;background:#151f23dc;border:1px solid #74674c;border-radius:5px;color:#e1d2b6;font:11px/1.5 system-ui,sans-serif;pointer-events:none}
#notice[hidden]{display:none!important}
</style>
</head>
<body>
<iframe id="game" title="NexGameWorld — игровая сцена" allow="fullscreen; autoplay" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="loading" role="status"><div><strong>NexGameWorld</strong><p>Загружаем игровой мир…</p></div></div>
<div id="notice" hidden>Пока обновляется версия на домене, игра открыта с резервного адреса. Сохранения на этих адресах раздельные.</div>
<!-- NexGameWorld 0.6.34: verify latest economy and quest assets on nexions.ru. -->
<!-- NexGameWorld 0.6.34.1: request verified roof material hotfix sync. -->
<!-- NexGameWorld 0.6.36: resynchronize mirrored assets after verified Tab targeting release. -->
<!-- NexGameWorld 0.6.38.13: trigger immediate mirror sync of portrait character inspection and equipment sheet. -->
<!-- NexGameWorld 0.6.38.14: restore polished flat NexGame character sheet with details and 3D rotation. -->
<!-- NexGameWorld 0.6.38.15: force mirror refresh after Safari SVG className compatibility fix. -->
<!-- NexGameWorld 0.6.38.16: synchronize authenticated server and frontend release. -->
<!-- NexGameWorld 0.6.38.17: require portal mirror of online integrity release. -->
<!-- NexGameWorld 0.6.38.18: synchronize spherical online collision and heartbeat update. -->
<script>
(()=>{
 'use strict';
 const frame=document.getElementById('game');
 const loading=document.getElementById('loading');
 const notice=document.getElementById('notice');
 const local='./planet-test/';
 const fallback='https://nexions-link.github.io/Nexgame/planet-test/';
 // Nexgame/main is authoritative; GitHub Pages and nexions.ru are mirrors.
 const source='https://raw.githubusercontent.com/Nexions-link/Nexgame/main/planet-test/';
 let checking=false,retryTimer=null,loadedVersion=null,loadedUrl=null;
 const params=new URLSearchParams(location.search);
 // The main game is now account-only. A bare /nexgameworld/ route or an old
 // anonymous bookmark must never silently start a local "Странник" character.
 // The read-only planet preview remains available separately.
 if(params.get('portal-preview')!=='1'){
  if(params.get('account-play')!=='1'){
   location.replace('/nexgameworld/account.html');
   return;
  }
  // Missing credentials in a new Safari tab should open the account screen,
  // not render an anonymous player or expose an expired session in the URL.
  let hasSelectedCharacter=false;
  try{
   hasSelectedCharacter=/^[A-Za-z0-9_-]{43}$/.test(sessionStorage.getItem('ngw-alpha-session')||'')&&
    /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(sessionStorage.getItem('ngw-selected-character')||'');
  }catch{}
  if(!hasSelectedCharacter){
   location.replace('/nexgameworld/account.html');
   return;
  }
 }
 // No third-party iframe for the normal route: the fully mirrored game is
 // served from nexions.ru and saves under this domain on iOS Safari.
 // Read both the same-domain mirror and the current upstream release.
 // During the few minutes before sync completes, launch the newest published build.
 function parseVersion(data){
  // Patch releases use four parts (e.g. 0.6.34.1); older builds use three.
  return data?.project==='NexGameWorld'&&/^[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?$/.test(data?.version||'')?
   data.version:null;
 }
 function isNewer(a,b){
  const left=a.split('.').map(Number),right=b.split('.').map(Number);
  // Compare 0.6.34 with 0.6.34.1 as 0.6.34.0 < 0.6.34.1.
  for(let i=0;i<Math.max(left.length,right.length);i++){
   const l=left[i]??0,r=right[i]??0;
   if(l!==r)return l>r;
  }
  return false;
 }
 async function readBuild(path){
  const response=await fetch(path+'version.json?check='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('Version is unavailable');
  const version=parseVersion(await response.json());
  if(!version)throw Error('Invalid NexGameWorld release');
  return version;
 }
 function scheduleRetry(){
  if(retryTimer!==null)return;
  retryTimer=setTimeout(()=>{
   retryTimer=null;
   void start();
  },8000);
 }
 async function start(){
  if(checking)return;
  checking=true;
  try{
   // Compare the same-domain mirror with BOTH upstream deployment and the
   // authoritative main-branch release. A scheduled mirror can lag by minutes.
   const [onDomain,upstream,mainBranch]=await Promise.allSettled([
    readBuild(local),readBuild(fallback),readBuild(source)
   ]);
   const localVersion=onDomain.status==='fulfilled'?onDomain.value:null;
   const upstreamVersion=upstream.status==='fulfilled'?upstream.value:null;
   const sourceVersion=mainBranch.status==='fulfilled'?mainBranch.value:null;
   let newest=localVersion;
   for(const candidate of [upstreamVersion,sourceVersion]){
    if(candidate&&(!newest||isNewer(candidate,newest)))newest=candidate;
   }
   const accountPlay=params.get('account-play')==='1';
   let url=local,version=localVersion;
   if(accountPlay){
    // Sessions are same-origin only; NEVER forward login tokens to upstream.
    // Do not launch an older account client while the scheduled mirror catches up.
    if(!localVersion||isNewer('0.6.32',localVersion)||newest&&isNewer(newest,localVersion)){
     loading.hidden=false;
     const waiting=newest&&localVersion&&isNewer(newest,localVersion);
     loading.querySelector('p').textContent=waiting
      ?'Доступна Alpha '+newest+'. Обновляем Nexions.ru (пока '+localVersion+'). Проверяем снова…'
      :'Ожидаем актуальную версию игры на Nexions.ru. Повторная проверка автоматически…';
     scheduleRetry();
     return;
    }
   }else if(!localVersion||(upstreamVersion&&isNewer(upstreamVersion,localVersion))){
    url=fallback;version=upstreamVersion;
    notice.hidden=false;
    if(!localVersion)console.warn('Local NexGameWorld mirror unavailable; using upstream');
    else console.info('NexGameWorld mirror updating: '+localVersion+' → '+upstreamVersion);
   }
   // A preview also must not silently call an older published client "latest".
   if(newest&&(!version||isNewer(newest,version))){
    loading.hidden=false;
    loading.querySelector('p').textContent='Публикуется Alpha '+newest+'. Проверяем готовность…';
    scheduleRetry();
    return;
   }
   if(!version){
    loading.hidden=false;
    loading.querySelector('p').textContent='Не удалось проверить версию игры. Повторяем запрос…';
    scheduleRetry();
    return;
   }
   if(retryTimer!==null){clearTimeout(retryTimer);retryTimer=null;}
   const target=new URL(url,location.href);
   target.searchParams.set('v',version);
   // Safari can cache an iframe document even when its version query was
   // unchanged. A new URL forces a fresh HTML navigation on each launch.
   target.searchParams.set('fresh',String(Date.now()));
   if(params.get('portal-preview')==='1')target.searchParams.set('portal-preview','1');
   if(accountPlay)target.searchParams.set('account-play','1');
   if(loadedVersion===version&&loadedUrl===url&&frame.src)return;
   loadedVersion=version;loadedUrl=url;
   loading.hidden=false;
   frame.addEventListener('load',()=>{loading.hidden=true;},{once:true});
   frame.src=target.href;
  }finally{checking=false;}
 }
 // Safari may restore the entire launcher + iframe from its back/forward cache.
 // Recheck after returning to the tab as well as on an initial visit.
 window.addEventListener('pageshow',event=>{if(event.persisted)void start();});
 document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)void start();
 });
 void start();
})();
</script>
</body>
</html>
