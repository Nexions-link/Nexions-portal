<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d"),keys=new Set();
const TW=76,TH=38,WORLD=27,START_HP=100,SCREEN_SPEED=124;
const joystick={pointer:null,x:0,y:0},stick=$("controls"),knob=$("joystickKnob");
const player={x:0,y:0,hp:100,maxHp:100,level:1,xp:0,gold:0,potions:2,flash:0,cooldown:0,facing:1,dir:2,walk:0,motion:0,animState:"idle"};
let quest=0,kills=0,relic=false,paused=false,dialogOpen=false,last=performance.now(),vw=innerWidth,vh=innerHeight,cameraX=0,cameraY=0,elapsed=0,toastUntil=0;
const SAVE_KEY="nexgame-rpg-v040",LEGACY_SAVE_KEY="nexgame-rpg-v030";
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({x:player.x,y:player.y,hp:player.hp,level:player.level,xp:player.xp,gold:player.gold,potions:player.potions,dir:player.dir,quest,kills,relic}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||localStorage.getItem(LEGACY_SAVE_KEY));if(!d)return;for(const k of ["x","y","hp","level","xp","gold","potions"]){if(Number.isFinite(d[k]))player[k]=d[k]}quest=Math.max(0,Math.min(6,d.quest|0));kills=Math.max(0,Math.min(3,d.kills|0));relic=!!d.relic;if(Number.isInteger(d.dir)&&d.dir>=0&&d.dir<8)player.dir=d.dir;player.x=Math.max(-WORLD,Math.min(WORLD,player.x));player.y=Math.max(-WORLD,Math.min(WORLD,player.y));player.level=Math.max(1,player.level);player.maxHp=START_HP+(player.level-1)*15;player.hp=Math.max(1,Math.min(player.maxHp,player.hp))}catch(e){}}
load();save();addEventListener("pagehide",save);
function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2}}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
// Screen-space directions E, SE, S, SW, W, NW, N, NE.
function directionFromVector(vx,vy){return(Math.round(Math.atan2(vy,vx)/(Math.PI/4))+8)%8}
const DIRECTION_NAMES=["восток","юго-восток","юг","юго-запад","запад","северо-запад","север","северо-восток"];
const npc=[
{x:1,y:-1,name:"Староста Эйрин",type:"elder"},
{x:-2,y:2,name:"Торговка Мира",type:"merchant"}
];
const relicSpot={x:12,y:-10};
const houses=[{x:-4,y:-3,type:"house"},{x:4,y:-4,type:"house"},{x:-4,y:4,type:"house"}];
const props=[];
for(let y=-WORLD;y<=WORLD;y++)for(let x=-WORLD;x<=WORLD;x++){const h=hash(x,y),r=Math.hypot(x,y);if(r>5.2&&h>.87&&Math.hypot(x-relicSpot.x,y-relicSpot.y)>2.3&&Math.hypot(x+12,y+10)>3.6){props.push({x,y,type:h>.975?"ruin":h>.933?"tree":h>.9?"rock":"dead"})}}
const enemies=[
{x:7,y:5,sx:7,sy:5,hp:48,maxHp:48,speed:.85,hit:0,dead:0,seed:1},
{x:9,y:2,sx:9,sy:2,hp:48,maxHp:48,speed:.82,hit:0,dead:0,seed:2},
{x:6,y:-5,sx:6,sy:-5,hp:48,maxHp:48,speed:.8,hit:0,dead:0,seed:3},
{x:11,y:6,sx:11,sy:6,hp:48,maxHp:48,speed:.82,hit:0,dead:0,seed:4},
{x:13,y:-6,sx:13,sy:-6,hp:48,maxHp:48,speed:.84,hit:0,dead:0,seed:5},
{x:-8,y:9,sx:-8,sy:9,hp:48,maxHp:48,speed:.8,hit:0,dead:0,seed:6}
];
// Solid footprints are deliberately smaller than crowns / rooftops:
// the player can walk behind scenery, but not through trunks or walls.
const colliders=[];
for(const h of houses)colliders.push({kind:"box",x:h.x+.48,y:h.y+.48,halfX:.93,halfY:.93});
for(const o of props){
 const radius=o.type==="tree"?.43:o.type==="dead"?.29:o.type==="rock"?.55:.55;
 colliders.push({kind:"circle",x:o.x,y:o.y,radius});
}
for(const n of npc)colliders.push({kind:"circle",x:n.x,y:n.y,radius:.29});
// Avoid foliage / rock accidentally covering a wolf's spawn position.
for(let i=colliders.length-1;i>=0;i--){
 const c=colliders[i];
 if(c.kind==="circle"&&enemies.some(e=>Math.hypot(e.sx-c.x,e.sy-c.y)<.68)&&!npc.some(n=>n.x===c.x&&n.y===c.y)){
  colliders.splice(i,1);
  const idx=props.findIndex(p=>p.x===c.x&&p.y===c.y);
  if(idx>=0)props.splice(idx,1);
 }
}
function collidesAt(x,y,radius=.26){
 if(x-radius < -WORLD+.1||x+radius > WORLD-.1||y-radius < -WORLD+.1||y+radius > WORLD-.1)return true;
 for(const o of colliders){
  const dx=x-o.x,dy=y-o.y;
  if(Math.abs(dx)>2.3||Math.abs(dy)>2.3)continue;
  if(o.kind==="circle"){
   const limit=radius+o.radius;
   if(dx*dx+dy*dy<limit*limit)return true;
  }else{
   const nearestX=Math.max(-o.halfX,Math.min(dx,o.halfX));
   const nearestY=Math.max(-o.halfY,Math.min(dy,o.halfY));
   const ex=dx-nearestX,ey=dy-nearestY;
   if(ex*ex+ey*ey<radius*radius)return true;
  }
 }
 return false;
}
function moveWithCollisions(entity,dx,dy,radius=.26){
 if(!dx&&!dy)return false;
 const tx=entity.x+dx,ty=entity.y+dy;
 if(!collidesAt(tx,ty,radius)){
  entity.x=tx;entity.y=ty;return true;
 }
 // Axis-separated fallback gives the analog stick smooth wall sliding.
 const steps=Math.abs(dx)>=Math.abs(dy)?[0,1]:[1,0];
 let moved=false;
 for(const axis of steps){
  if(axis===0&&dx&&!collidesAt(entity.x+dx,entity.y,radius)){entity.x+=dx;moved=true}
  else if(axis===1&&dy&&!collidesAt(entity.x,entity.y+dy,radius)){entity.y+=dy;moved=true}
 }
 return moved;
}
function ensurePlayerNotInWall(){
 if(!collidesAt(player.x,player.y))return;
 const startX=player.x,startY=player.y;
 for(let ring=.4;ring<7;ring+=.3){
  for(let i=0;i<24;i++){
   const angle=i*Math.PI/12;
   const x=startX+ring*Math.cos(angle),y=startY+ring*Math.sin(angle);
   if(!collidesAt(x,y)){player.x=x;player.y=y;return}
  }
 }
 player.x=0;player.y=0;
}
ensurePlayerNotInWall();
function resize(){vw=innerWidth;vh=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(vw*d);canvas.height=Math.round(vh*d);ctx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",resize);resize();

addEventListener("blur",clearControls);document.addEventListener("visibilitychange",()=>{if(document.hidden){clearControls();save()}});addEventListener("pagehide",clearControls);
function moveJoystick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy),radius=r.width*.29,scale=dist>radius?radius/dist:1;const px=dx*scale,py=dy*scale;knob.style.transform="translate("+px+"px,"+py+"px)";joystick.x=dist<7?0:px/radius;joystick.y=dist<7?0:py/radius}
stick.addEventListener("pointerdown",e=>{if(paused||dialogOpen||joystick.pointer!==null)return;e.preventDefault();joystick.pointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveJoystick(e)});

 Object.assign(player,{x:0,y:0,hp:100,maxHp:100,level:1,xp:0,gold:0,potions:2,flash:0,cooldown:0,facing:1,dir:2,walk:0,motion:0,animState:"idle"});

function showBag(){if(paused)return;if(dialogOpen){closeDialog();return}showDialog("Рюкзак странника","Инвентарь · "+player.gold+" золотых",["Потёртый меч — оружие воина.","Плащ странника — лёгкая походная одежда.",relic?"Древняя печать — находка из руин.":"Здесь появятся найденные предметы."]);choice("🧪 Зелье лечения × "+player.potions+" (+40 HP)",()=>{if(player.potions<1){toast("Зелий больше нет");return}if(player.hp>=player.maxHp){toast("Здоровье уже полное");return}player.potions--;player.hp=Math.min(player.maxHp,player.hp+40);closeDialog();toast("Здоровье восстановлено");save()});choice("Закрыть",closeDialog,true)}
function levelXp(){return 100+(player.level-1)*45}

function update(dt){
 elapsed+=dt;
 const kx=Number(keys.has("d")||keys.has("arrowright"))-Number(keys.has("a")||keys.has("arrowleft"));
 const ky=Number(keys.has("s")||keys.has("arrowdown"))-Number(keys.has("w")||keys.has("arrowup"));
 let vx=joystick.x+kx,vy=joystick.y+ky;
 const intensity=Math.hypot(vx,vy);
 if(intensity>1){vx/=intensity;vy/=intensity}
 const strength=Math.min(intensity,1);
 if(strength>.02){
  // The pose uses the *screen* direction, independent of isometric world axes.
  player.dir=directionFromVector(vx,vy);
  if(Math.abs(vx)>.08)player.facing=vx>0?1:-1;
  const dx=(vx/TW+vy/TH)*SCREEN_SPEED*dt,dy=(vy/TH-vx/TW)*SCREEN_SPEED*dt;
  const moved=moveWithCollisions(player,dx,dy,.26);
  if(moved){
   player.walk+=strength*dt*12;
   player.motion=Math.min(1,(player.motion||0)+dt*9);
  }else player.motion=Math.max(0,(player.motion||0)-dt*12);
 }else player.motion=Math.max(0,(player.motion||0)-dt*8);
 player.cooldown=Math.max(0,player.cooldown-dt);
 player.flash=Math.max(0,player.flash-dt);
 player.animState=player.flash>0?"attack":player.motion>.12?"run":"idle";
 for(const e of enemies){
  if(e.dead>0){
   e.dead-=dt;
   if(e.dead<=0){e.dead=0;e.hp=e.maxHp;e.x=e.sx;e.y=e.sy}
   continue;
  }
  e.hit-=dt;
  e.hitFlash=Math.max(0,(e.hitFlash||0)-dt);
  const pd=distance(player,e),home=Math.hypot(player.x-e.sx,player.y-e.sy);
  let targetX=e.sx,targetY=e.sy,spd=.44;
  if(pd<4.5&&home<6){targetX=player.x;targetY=player.y;spd=e.speed}
  const dx=targetX-e.x,dy=targetY-e.y,dist=Math.hypot(dx,dy);
  if(dist>.8)moveWithCollisions(e,dx/dist*spd*dt,dy/dist*spd*dt,.29);
  if(pd<.8&&home<6&&e.hit<=0){
   player.hp-=9;
   e.hit=1.15;
   if(player.hp<=0){player.hp=player.maxHp;player.x=0;player.y=0;resetJoystick();toast("Ты очнулся в Тихом Приюте")}
  }
 }
 const p=iso(player.x,player.y);
 cameraX=p.x-vw/2;cameraY=p.y-vh*.51;
 refreshHUD();
 if(toastUntil&&performance.now()>toastUntil){$("toast").classList.remove("visible");toastUntil=0}
}
function polygon(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function line(ax,ay,bx,by,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke()}
function radial(cx,cy,r,inner,outer){
 const g=ctx.createRadialGradient(cx-r*.2,cy-r*.3,Math.max(1,r*.03),cx,cy,r);
 g.addColorStop(0,inner);g.addColorStop(1,outer);return g;
}
function softShadow(x,y,rx,ry,a=.23){
 ctx.save();ctx.fillStyle="rgba(27,47,51,"+a+")";ctx.shadowColor="#203d45";ctx.shadowBlur=13;
 ctx.beginPath();ctx.ellipse(x+10,y+8,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
// A tight shadow at each character's ground anchor, plus a soft outer shadow.
function contactShadow(x,y,rx=17,ry=5){
 ctx.save();
 ctx.fillStyle="#294b4744";ctx.shadowColor="#1a3330";ctx.shadowBlur=9;
 ctx.beginPath();ctx.ellipse(x+5,y+3,rx+6,ry+3,0,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;ctx.fillStyle="#1c383a99";
 ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function leaf(x,y,rx,ry,c1,c2){

 ctx.strokeStyle="#c9ecb733";ctx.lineWidth=1;ctx.beginPath();
 ctx.ellipse(x-3,y-3,rx*.77,ry*.7,-.17,Math.PI*1.1,Math.PI*1.82);ctx.stroke();ctx.restore();
}

// Eight screen-space facings. Mirrors are used only for leftward views;
// front, side, three-quarter and back have genuinely different silhouettes.
function drawPlayer(){
 const p=iso(player.x,player.y),x=p.x,y=p.y;
 const dir=Number.isInteger(player.dir)?player.dir:2;
 const back=dir===5||dir===6||dir===7;
 const fullBack=dir===6,fullFront=dir===2;
 const sideView=dir===0||dir===4;
 const quarter=dir===1||dir===3||dir===5||dir===7;
 const mirror=dir===3||dir===4||dir===5?-1:1;
 const motion=player.motion||0;
 const attack=player.animState==="attack"||player.flash>0;
 const stride=Math.sin(player.walk||0)*4.3*motion;
 const armSwing=Math.sin(player.walk||0)*3.8*motion;
 const capeWave=Math.sin((player.walk||0)*.65)*2.2*motion;
 const breathing=(Math.sin(elapsed*2.4)*.6)*(1-motion);
 const bodyWidth=sideView?10:quarter?13:16;
 contactShadow(x,y,sideView?15:18,5);
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(mirror,1);

 // The cloak, body and boots use one grounded origin.
 // Moving the feet relative to that point prevents accidental "levitation".
 const capeColor=ctx.createLinearGradient(-23,-51,16,-4);
 capeColor.addColorStop(0,"#7295a6");
 capeColor.addColorStop(.55,"#426a82");
 capeColor.addColorStop(1,"#294a68");
 const tail=back?2:0;
 const cloakTip=-2+tail;
 polygon([[-bodyWidth+2,-49],[-bodyWidth-8,-39],
          [-bodyWidth-10-capeWave,-10],[-bodyWidth-4-capeWave,-3],
          [6+capeWave,-5],[bodyWidth+2,-37]],capeColor,"#2e4b63");
 polygon([[-bodyWidth-8,-13],[-bodyWidth-7,-30],
          [-bodyWidth-3-capeWave,-5],[-bodyWidth-7-capeWave,cloakTip]],
         "#a3c0c33d");

 // Separate boots: the supporting sole remains at ground level,
 // while the other can lift just a couple of pixels during its stride.
 const stance=sideView?6:7.4;
 for(const foot of [-1,1]){
  const phase=foot*stride;
  const lift=Math.max(0,phase)*.38;

  polygon([[cx-4,-24],[cx+5,-24],[cx+6,-12],[cx-4,-12]],"#52677d","#385064");

 }

 // Idle breathing and a modest upper-body gait never displace the boots.
 ctx.save();
 ctx.translate(0,breathing+Math.abs(Math.sin(player.walk||0))*.55*motion);

 // Rear arm is partly hidden behind the breastplate or cape.
 const armOffset=armSwing*.47;
 polygon([[-bodyWidth+1,-46],[-bodyWidth-7,-39],
          [-bodyWidth-5-armOffset,-23],[-bodyWidth+1-armOffset,-21],

 ellipse(-bodyWidth-3-armOffset,-21,4.6,5,"#dfb69a");

 const armor=ctx.createLinearGradient(-18,-51,22,-16);
 armor.addColorStop(0,"#e0e4de");armor.addColorStop(.46,"#8db4bc");
 armor.addColorStop(1,"#486c83");
 if(fullBack){
  // The back view does not show facial features or a front breastplate.
  polygon([[-17,-49],[-20,-33],[-15,-15],[15,-15],[19,-33],[16,-49]],
          "#527b90","#29465e");
  polygon([[-18,-43],[-19,-30],[-14,-14],[13,-14],[20,-30],[15,-43]],

  polygon([[-4,-47],[5,-47],[10,-16],[-8,-16]],"#608ca0","#41647a");
  polygon([[-9,-37],[0,-43],[9,-37],[0,-26]],"#d8c386","#8b7e66");
 }else if(back){
  // Three-quarter rear: broad cloak, one bright shoulder and visible arm.
  polygon([[-12,-51],[-18,-35],[-12,-16],[12,-16],[15,-39],[9,-50]],
          "#577d92","#34536c");
  polygon([[-13,-42],[-17,-28],[-10,-13],[4,-14],[12,-39]],
          capeColor,"#32536b");
  polygon([[2,-42],[11,-45],[14,-25],[7,-20]],"#87aab4","#4d768b");
  polygon([[-9,-33],[-2,-37],[4,-32],[-2,-26]],"#c5bc92","#7b867e");
 }else if(sideView){
  // Narrow profile: single shoulder, a slim plate and the sword arm.
  polygon([[-9,-49],[-12,-39],[-8,-18],[9,-18],[12,-39],[7,-50]],
          "#4a7386","#294f66");
  polygon([[1,-48],[9,-44],[10,-24],[3,-20],[-1,-28]],armor,"#50768a");
  polygon([[2,-40],[8,-43],[8,-26],[5,-23]],"#bee0d7","#648998");
 }else if(quarter){
  // Three-quarter front reveals the edge of the armour and part of the cape.
  polygon([[-13,-49],[-16,-35],[-11,-19],[11,-19],[17,-39],[10,-50]],
          "#4a6880","#324c66");
  polygon([[-9,-48],[1,-53],[10,-47],[13,-35],[9,-23],[-8,-23]],
          armor,"#4a657d");
  polygon([[2,-45],[10,-44],[11,-28],[4,-26]],"#426f86","#3d5b75");
  polygon([[-8,-42],[1,-47],[4,-42],[2,-27],[-7,-29]],
          "#a3d0cd","#4f788c");
 }else{
  // Full frontal armour: symmetrical chest facets and breastplate jewel.
  polygon([[-15,-48],[-18,-36],[-12,-18],[13,-18],[18,-36],[14,-48]],
          "#56738a","#314e64");
  polygon([[-11,-47],[-5,-52],[7,-52],[12,-46],[14,-35],[9,-23],[-10,-23],[-14,-35]],
          armor,"#415e74");
  polygon([[-10,-43],[0,-49],[0,-26],[-7,-27]],"#bfdbd3","#678e9a");
  polygon([[0,-49],[10,-43],[8,-28],[0,-26]],"#6897a6","#416d86");
 }
 // Belt and polished shoulder plates.
 line(-bodyWidth+3,-20,bodyWidth-3,-20,"#654e44",5);
 ellipse(0,-20,4.2,3.2,"#e9c77c");
 const farShoulder=sideView?-9:-bodyWidth-1,nearShoulder=sideView?10:bodyWidth+1;
 ellipse(farShoulder,-45,sideView?7:9,7,"#668a9a");
 ellipse(farShoulder-1,-48,sideView?6:7,5.5,
         radial(farShoulder-3,-50,12,"#d3e2da","#789da9"));
 ellipse(nearShoulder,-44,9.5,8,"#4c7289");
 ellipse(nearShoulder-1,-47,8,6,radial(nearShoulder-3,-50,12,"#e4e6de","#6c96a8"));
 polygon([[nearShoulder+3,-39],[nearShoulder+8,-30],
          [nearShoulder+4,-25],[nearShoulder-2,-31]],"#8baeb6","#446d84");

 // Head silhouette: visible face, profile, or back of the head.
 const headX=sideView?3:quarter?2:0;
 const hair=ctx.createLinearGradient(-12,-72,13,-55);
 hair.addColorStop(0,"#876751");hair.addColorStop(1,"#493b39");
 ellipse(headX,-60,sideView?8.6:10,11.5,"#6a4c41");
 if(fullBack){
  ellipse(0,-62,10,11.6,hair);
  polygon([[-10,-63],[-12,-70],[-4,-77],[6,-75],[11,-67],[8,-61]],
          "#75584b","#453535");
  line(-6,-62,5,-62,"#b9927b",1.4);
 }else if(back){
  ellipse(headX-1,-61,10,11.2,hair);
  polygon([[-8,-66],[-10,-72],[-2,-76],[10,-73],[11,-64],[4,-61]],
          "#6b5047","#463737");
  ellipse(headX+7,-58,2.4,4,"#c89c83");
 }else{
  ellipse(headX,-58,sideView?7:9.2,10.1,
          radial(headX-4,-63,16,"#ffe9cf","#b88270"));
  if(sideView){
   polygon([[headX+3,-58],[headX+13,-55],[headX+4,-51]],
           "#cd927e");
   ellipse(headX+4,-60,1.5,1.5,"#443a39");
   line(headX+6,-51,headX+10,-51,"#9c6c62",1.3);
  }else if(quarter){
   ellipse(headX+4,-59,1.6,1.6,"#463c39");
   ellipse(headX-3,-60,1,1,"#6a4c42");
   polygon([[headX+6,-57],[headX+10,-54],[headX+6,-52]],"#d9a18b");
   line(headX,-51,headX+5,-51,"#a47065",1.1);
  }else{
   ellipse(headX-3.6,-59,1.4,1.5,"#443a39");
   ellipse(headX+3.6,-59,1.4,1.5,"#443a39");
   line(-1,-52,3,-52,"#a87468",1.2);
  }
  polygon([[headX-11,-65],[headX-10,-70],[headX-2,-76],
           [headX+9,-72],[headX+11,-65],[headX+5,-68],[headX-3,-67]],
          hair,"#443735");
  polygon([[headX-10,-66],[headX-5,-74],[headX+1,-73],[headX-2,-66]],
          "#97735d");
 }
 if(!back){
  // Only the front and profile show the jewel on the chest.
  ellipse(sideView?7:quarter?1:0,-38,3.3,3.5,"#f7d58c");
  ellipse(sideView?6:quarter?0:-1,-39,1.3,1.5,"#fff9cd");
 }
 // Sword hand animates opposite the legs, then executes a real swing.
 const weaponX=sideView?15:quarter?20:22;
 const handY=-31-armSwing*.45;
 polygon([[weaponX-8,-39],[weaponX,-39],[weaponX+5,handY],
          [weaponX-1,handY+2]],"#8dabb5","#436a7f");
 ctx.save();
 ctx.translate(weaponX,handY);
 const attackPhase=attack?1-Math.min(1,player.flash/.32):0;
 const weaponAngle=attack?(.22-2.22*Math.sin(attackPhase*Math.PI)):.18+Math.sin(elapsed*1.7)*.02;
 ctx.rotate(weaponAngle);
 ellipse(0,1,5.2,5.8,"#dcb393");
 line(0,4,0,12,"#5f473e",5);
 line(-8,12,8,12,"#e7c68d",3.5);
 polygon([[-3,12],[3,12],[5,29],[0,39],[-5,29]],"#eef3ef","#7d9cab");
 polygon([[-3,12],[0,39],[0,16]],"#ffffffaa");
 line(-2,15,-2,30,"#effcfff0",1.3);
 ctx.restore();
 if(attack){
  ctx.save();
  ctx.globalAlpha=Math.min(1,player.flash/.32)*.8;
  ctx.shadowColor="#ffe4a1";ctx.shadowBlur=11;
  ctx.strokeStyle="#fff0bc";ctx.lineWidth=4.5;
  ctx.beginPath();ctx.ellipse(7,-31,45,22,-.15,Math.PI*1.14,Math.PI*1.9);ctx.stroke();
  ctx.restore();
 }
 ctx.restore();
 ctx.restore();
}
function drawGround(){
 const c=iso(player.x,player.y);
 for(let y=-WORLD;y<=WORLD;y++)for(let x=-WORLD;x<=WORLD;x++){
  const p=iso(x,y);
  if(Math.abs(p.x-c.x)>vw/2+TW||Math.abs(p.y-c.y)>vh/2+TH)continue;
  const h=hash(x,y),village=Math.hypot(x,y)<5.3;
  const road=(Math.abs(y-x*.18)<1.3&&x>0&&x<14)||Math.hypot(x-relicSpot.x,y-relicSpot.y)<2;
  const lake=Math.hypot(x+12,y+10)<3.5;
  let color;
  if(lake)color=h>.5?"#539dad":"#478d9f";
  else if(road)color=h>.5?"#bcac85":"#b5a480";
  else if(village)color=h>.5?"#83b890":"#7bac86";
  else color=h>.87?"#78a96c":h>.63?"#69a779":h>.31?"#75b184":"#70aa79";
  polygon([[p.x,p.y-TH/2],[p.x+TW/2,p.y],[p.x,p.y+TH/2],[p.x-TW/2,p.y]],color,road?"#a79a7b44":"#417d6530");
  if(lake){
   if(h>.72){line(p.x-11,p.y+3,p.x+6,p.y+3,"#b7edf087",1.2);line(p.x-5,p.y-4,p.x+9,p.y-4,"#b7edf071",1)}
  }else if(road){
   if(h>.75){ellipse(p.x-7,p.y+4,3,1.6,"#e5d7b199");ellipse(p.x+14,p.y-2,2,1,"#877b6599")}
  }else{
   if(h>.56)plant(p.x+(hash(x+7,y)*25-12),p.y+(hash(x,y+17)*13-7),h);
   if(h>.93)ellipse(p.x+7,p.y-4,4,2.4,"#b4cfa477");
  }
 }
}
function draw(){
 const bg=ctx.createLinearGradient(0,0,0,vh);
 bg.addColorStop(0,"#a6ced0");bg.addColorStop(1,"#d5e7c4");
 ctx.fillStyle=bg;ctx.fillRect(0,0,vw,vh);
 ctx.save();ctx.translate(-cameraX,-cameraY);drawGround();
 const center=iso(player.x,player.y);
 const inView=o=>{const p=iso(o.x,o.y);return Math.abs(p.x-center.x)<vw/2+120&&Math.abs(p.y-center.y)<vh/2+210};
 const drawables=[];
 for(const o of props)if(inView(o))drawables.push({z:o.x+o.y,draw:()=>drawProp(o)});
 for(const o of houses)if(inView(o))drawables.push({z:o.x+o.y,draw:()=>drawHouse(o)});
 for(const o of npc)if(inView(o))drawables.push({z:o.x+o.y,draw:()=>drawNpc(o)});
 for(const e of enemies)if(e.dead<=0&&inView(e))drawables.push({z:e.x+e.y,draw:()=>drawEnemy(e)});
 if(inView(relicSpot))drawables.push({z:relicSpot.x+relicSpot.y,draw:drawRelic});
 drawables.push({z:player.x+player.y,draw:drawPlayer});
 drawables.sort((a,b)=>a.z-b.z);
 for(const o of drawables)o.draw();
 ctx.restore();
 // Daylight gradient and soft, warm corners instead of Gothic near-black.
 const sun=ctx.createRadialGradient(vw*.82,vh*.18,15,vw*.82,vh*.18,Math.max(vw,vh)*.95);
 sun.addColorStop(0,"#fff8db20");sun.addColorStop(1,"#ffffff00");
 ctx.fillStyle=sun;ctx.fillRect(0,0,vw,vh);
 const vignette=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.25,vw/2,vh/2,Math.max(vw,vh)*.88);
 vignette.addColorStop(0,"#00000000");vignette.addColorStop(1,"#173b4544");
 ctx.fillStyle=vignette;ctx.fillRect(0,0,vw,vh);
}
function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;if(!paused&&!dialogOpen)update(dt);else refreshHUD();draw();requestAnimationFrame(frame)}
let lastSave=performance.now();function autosave(t){if(t-lastSave>6500){lastSave=t;save()}requestAnimationFrame(autosave)}
const p=iso(player.x,player.y);cameraX=p.x-innerWidth/2;cameraY=p.y-innerHeight*.51;refreshHUD();requestAnimationFrame(frame);requestAnimationFrame(autosave);
</script></body></html>
