name: Bundle Santa Neon API
on:
  push:
    branches: [main]
    paths:
      - 'santa/neon-function/index.js'
      - 'santa/neon-function/package.json'
      - '.github/workflows/santa-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and bundle
        working-directory: santa/neon-function
        run: |
          npm install --no-audit --no-fund
          npx --yes esbuild index.js --bundle --minify --legal-comments=none --platform=node --format=esm --target=node24 --banner:js='import { createRequire } from "node:module"; const require = createRequire(import.meta.url);' --outfile=bundle/index.js
      - name: Compress deployable bundle
        working-directory: santa/neon-function/bundle
        run: |
          cp ../package.json package.json
          zip -9 function.zip index.js package.json
          base64 -w0 function.zip > function.zip.b64
      - name: Save deployable bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add santa/neon-function/bundle/index.js santa/neon-function/bundle/function.zip.b64
          if ! git diff --cached --quiet; then
            git commit -m 'Build deployable Secret Santa server bundle'
            git push
          fi
