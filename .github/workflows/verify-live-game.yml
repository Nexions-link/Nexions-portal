name: Verify live NexGameWorld on nexions.ru
# A green mirror commit alone is not a green public release.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live-game.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
concurrency:
  group: ngw-portal-live-audit
  cancel-in-progress: true
jobs:
  live-release:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production release check
        run: node --test nexgameworld/ops/audit-production.test.mjs
      - name: Verify NexGameWorld source main, published game HTML, assets, Render, and mirror SHA
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git ls-remote https://github.com/Nexions-link/Nexgame.git refs/heads/main | cut -f1)"
          test "${#source_sha}" -eq 40
          EXPECTED_SOURCE_SHA="$source_sha" node --input-type=module <<'JS'
          import {auditWithRetry} from './nexgameworld/ops/audit-production.mjs';
          try{
            const result=await auditWithRetry({
              expectedSha:process.env.EXPECTED_SOURCE_SHA,
              timeoutMs:55000
            },{attempts:20,delayMs:20000});
            console.log('PUBLIC RELEASE VERIFIED:',JSON.stringify(result));
          }catch(error){
            console.error('Nexions.ru release incomplete:',error.message);
            process.exitCode=1;
          }
          JS
