name: NexGameWorld account page checks
on:
  push:
    branches:
      - main
      - feature/ngw-auth-hardening-0.7.1
    paths:
      - 'nexgameworld/account.html'
      - 'nexgameworld/account.js'
      - '.github/workflows/account-ci.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check nexgameworld/account.js
      - name: Validate security and account flows
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('nexgameworld/account.html','utf8');
          const js=readFileSync('nexgameworld/account.js','utf8');
          const mirror=readFileSync('.github/workflows/sync-nexgame.yml','utf8');
          const launcher=readFileSync('nexgameworld/index.html','utf8');
          assert.match(html,/Content-Security-Policy/);
          assert.ok(html.includes('connect-src https://api.nexions.ru;'));
          assert.ok(js.includes("API='https://api.nexions.ru/api/ngw'"));
          assert.match(html,/script-src 'self'/);
          assert.match(html,/src="\.\/account\.js\?v=[0-9.]+"/);
          assert.doesNotMatch(html,/<script type="module">/);
          assert.match(mirror,/--exclude='\/account\.js'/);
          assert.doesNotMatch(html,/id="inviteCode"/);
          assert.match(html,/id="passwordChangeForm"/);
          assert.match(html,/id="deleteDialog"/);
          assert.match(launcher,/account-play/);
          assert.ok(launcher.includes('0.6.32'));
          assert.doesNotMatch(js,/inviteCode/);
          assert.match(js,/currentPassword/);
          assert.match(js,/ngw-selected-character/);
          assert.match(js,/account-play=1/);
          assert.match(js,/function clearSession\(/);
          assert.match(js,/removeStorage\('sessionStorage',SESSION_KEY\)/);
          assert.match(js,/removeStorage\('localStorage',REMEMBER_KEY\)/);
          assert.match(js,/writeStorage\('localStorage',REMEMBER_KEY,token\)/);
          assert.match(js,/writeStorage\('sessionStorage',SESSION_KEY,token\)/);
          assert.match(html,/id="rememberLogin"/);
          assert.match(html,/Запомнить меня на этом устройстве/);
          assert.doesNotMatch(js,/localStorage\.setItem\([^\n]*password/i);
          console.log('Account page, auth flows, CSP and mirror exclusions: OK');
          JS
