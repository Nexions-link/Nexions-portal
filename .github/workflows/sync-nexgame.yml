name: Sync NexGameWorld to nexions.ru
# Re-run source-verified game mirror after the bandit camp release.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-nexgame.yml'
      - 'nexgameworld/index.html'
      - 'index.html'
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows can run a little later than the stated time.
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: nexions-game-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nexions portal
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch latest public NexGameWorld
        run: |
          git clone --quiet --depth 1 --branch main https://github.com/Nexions-link/Nexgame.git "$RUNNER_TEMP/nexgame-source"

      - name: Mirror game assets under the same-domain route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nexgameworld
          # The custom-domain launcher is the ONLY entry point. Mirror the
          # spherical client plus its shared imports, models and art assets.
          # The archived flat prototype must never reappear on nexions.ru.
          # Files in both fresh checkouts often have identical mtime/length;
          # --checksum prevents stale same-sized JS and HTML after a release.
          # Sync Alpha 0.6.29 terrain IK with source-verified asset checks.
          rsync -a --checksum --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/index.html' \
            --exclude='/account.html' \
            --exclude='/account.js' \
            --exclude='/app.html' \
            --exclude='/game.js' \
            --exclude='/versions/' \
            --exclude='/portal/' \
            --exclude='/CNAME' \
            --exclude='/server/' \
            --exclude='/tests/' \
            --exclude='/*.md' \
            --exclude='/package.json' \
            "$RUNNER_TEMP/nexgame-source/" "nexgameworld/"
          # rsync protects excludes from --delete, so explicitly erase files
          # mirrored when the flat prototype was still public.
          rm -f nexgameworld/app.html nexgameworld/game.js
          rm -rf nexgameworld/versions nexgameworld/portal
          git -C "$RUNNER_TEMP/nexgame-source" rev-parse HEAD > nexgameworld/upstream-commit.txt
          test -s nexgameworld/planet-test/index.html
          test -s nexgameworld/planet-test/version.json
          test -s nexgameworld/planet-test/planet.js
          test -s nexgameworld/style.css
          test -s nexgameworld/skills.js
          test ! -e nexgameworld/app.html
          test ! -e nexgameworld/game.js
          test ! -e nexgameworld/versions
          test ! -e nexgameworld/portal
          # Reject incomplete or mixed releases before committing.
          for file in planet-test/index.html planet-test/planet.js \
                      planet-test/offline-rpg.js \
                      planet-test/interaction-targeting.js \
                      planet-test/version.json; do
            cmp "$RUNNER_TEMP/nexgame-source/$file" "nexgameworld/$file"
          done
          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("nexgameworld/planet-test/version.json","utf8")).version;const html=fs.readFileSync("nexgameworld/planet-test/index.html","utf8");const expected="data-build="+String.fromCharCode(34)+v+String.fromCharCode(34);if(!html.includes(expected))throw Error("Game page build and version.json disagree: "+v)'
          # Fail early on an incomplete static mirror; do not publish broken game.
          test -f nexgameworld/index.html
          test -d nexgameworld/assets

      - name: Publish and validate Atlas on the custom domain
        shell: bash
        run: |
          set -euo pipefail
          # Keep a native page at /atlas/ with explicit same-origin paths.
          # Never rely on <base>: inline module imports and Safari URL
          # resolution may otherwise break depending on the entry URL.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('nexgameworld/bestiary')
          source = (root / 'atlas.html').read_text(encoding='utf-8')
          script = (root / 'atlas.js').read_text(encoding='utf-8')
          if source.count('<head>') != 1 or 'id="viewerCanvas"' not in source:
              raise SystemExit('Upstream Atlas HTML is missing its viewer')
          if 'new URL(entry.asset,import.meta.url)' not in script:
              raise SystemExit('Atlas must resolve models relative to its JS module')
          replacements = [
              ("atlasStyles.href='./atlas.css?refresh='+Date.now();",
               "atlasStyles.href='/nexgameworld/bestiary/atlas.css?refresh='+Date.now();"),
              ("import('./atlas.js?refresh='+Date.now())",
               "import('/nexgameworld/bestiary/atlas.js?refresh='+Date.now())"),
          ]
          atlas = source.replace('<head>',
              '<head><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="shortcut icon" href="/favicon.svg"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="canonical" href="https://nexions.ru/atlas/">', 1)
          for old, new in replacements:
              if atlas.count(old) != 1:
                  raise SystemExit('Atlas entry point changed; refusing broken publish: ' + old)
              atlas = atlas.replace(old, new, 1)
          if '<base ' in atlas:
              raise SystemExit('Unexpected <base> on standalone Atlas route')
          catalog = (root / 'atlas-catalog.js').read_text(encoding='utf-8')
          model_paths = re.findall(r"asset:'([^']+)'", catalog)
          if not model_paths:
              raise SystemExit('Atlas catalog contains no models')
          for model_path in model_paths:
              asset = root / model_path
              if not asset.is_file() or asset.stat().st_size == 0:
                  raise SystemExit('Missing 3D model: ' + str(asset))
              if asset.suffix.lower() == '.glb':
                  with asset.open('rb') as model_file:
                      header = model_file.read(12)
                  if (len(header) != 12 or header[:4] != b'glTF'
                          or int.from_bytes(header[4:8], 'little') != 2
                          or int.from_bytes(header[8:12], 'little') != asset.stat().st_size):
                      raise SystemExit('Invalid GLB container: ' + str(asset))
          for relative in ('atlas.css', 'atlas.js', 'atlas-catalog.js',
                           'atlas-palette-editor.js', '../planet-test/loot-tables.js',
                           '../items.js'):
              if not (root / relative).is_file():
                  raise SystemExit('Missing Atlas dependency: ' + relative)
          out = Path('atlas/index.html')
          out.parent.mkdir(parents=True, exist_ok=True)
          if not out.exists() or out.read_text(encoding='utf-8') != atlas:
              out.write_text(atlas, encoding='utf-8')
          print(f'Atlas verified: {len(model_paths)} model references, same-origin modules and loot')
          PY

      - name: Generate Apple touch icon from NGW favicon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          cairosvg.svg2png(url='favicon.svg', write_to='apple-touch-icon.png',
                           output_width=180, output_height=180)
          if Path('apple-touch-icon.png').stat().st_size < 500:
              raise SystemExit('Apple icon generation failed')
          print('Apple touch icon generated at 180x180')
          PY

      - name: Commit newer game files
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git add -A nexgameworld atlas/index.html apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Portal already contains latest NexGameWorld."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "sync: update NexGameWorld game assets from Nexgame/main"
          # Other workflows or people can update portal/main after checkout.
          # Replay our already-validated mirror commit onto the newest portal
          # history, and retry a rejected non-fast-forward without force push.
          for attempt in 1 2 3 4; do
            git fetch origin main:refs/remotes/origin/main
            if ! git -c user.name="github-actions[bot]" \
                     -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                     rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::Could not replay verified mirror changes over updated portal/main"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Portal main advanced during sync (attempt $attempt/4); retrying"
            sleep "$((attempt * 2))"
          done
          echo "::error::NexGameWorld mirror could not be published after four safe retries"
          exit 1

      - name: Request Pages rebuild after a bot commit
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Bot commits cannot themselves trigger the branch-based Pages build.
          # This explicit build request refreshes the custom-domain site.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
            echo "::warning::Game mirror committed, but Pages rebuild could not be requested. A normal push to the portal repository will publish it."
          fi
