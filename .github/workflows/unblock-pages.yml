name: Unblock stalled Pages deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unblock-pages.yml']
permissions:
  contents: read
  pages: write
jobs:
  cancel-stalled:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment without deleting site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/8f0ae5a56fa62d8f913579a93daad70698ac04e9/cancel"
          echo "Requested cancellation of stalled Pages deployment."
