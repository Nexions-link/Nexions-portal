<title>NexGameWorld · Альфа</title>
<style>
:root{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-width:0;min-height:100%;background:#09151b;-webkit-text-size-adjust:100%}
body{font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9e7da;overflow-x:hidden}
main{position:relative;isolation:isolate;min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;padding:30px 18px max(30px,env(safe-area-inset-bottom));overflow:hidden;background:
 radial-gradient(ellipse 60% 46% at 50% 49%,rgba(54,104,103,.27),transparent 78%),
 radial-gradient(ellipse 80% 62% at 52% 108%,rgba(90,109,83,.15),transparent 80%),
 linear-gradient(180deg,#07141c 0%,#10252d 54%,#0b1b22 100%)}
main::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;opacity:.52;background-image:
 radial-gradient(1px 1px at 8% 18%,#d3d8c6 99%,transparent),
 radial-gradient(1px 1px at 22% 36%,#d3d8c6 99%,transparent),
 radial-gradient(1px 1px at 37% 9%,#c6d1c6 99%,transparent),
 radial-gradient(1px 1px at 61% 22%,#c6d1c6 99%,transparent),
 radial-gradient(1px 1px at 84% 14%,#d3d8c6 99%,transparent),
 radial-gradient(1px 1px at 93% 40%,#d3d8c6 99%,transparent);
 background-size:650px 520px}
.ambient-landscape{position:absolute;inset:auto 0 0;z-index:-1;width:100%;height:min(42dvh,350px);overflow:hidden;pointer-events:none;opacity:.69;mask-image:linear-gradient(to bottom,transparent 0%,black 19%,black 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 19%,black 100%)}
.ambient-landscape svg{display:block;width:100%;height:100%}
.ambient-landscape .ridge-far{fill:#314445;opacity:.47}
.ambient-landscape .ridge-near{fill:#172b2d;opacity:.93}
.ambient-landscape .treeline{fill:#0a1d24}

h1{position:relative;z-index:2;margin:0;text-align:center;font:600 clamp(34px,6.3vw,66px)/1.23 "Cinzel","Palatino Linotype","Book Antiqua",Georgia,serif;letter-spacing:.018em;background:linear-gradient(180deg,#faeacc 9%,#dac08f 66%,#a78b61);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 9px 35px rgba(203,172,116,.09)}
h1::after{content:"";display:block;width:62px;height:1px;margin:10px auto 0;background:linear-gradient(90deg,transparent,#b9a171,transparent)}

.planet-wrap{position:relative;isolation:isolate;width:min(88vw, min(62dvh,600px));aspect-ratio:1;margin:8px auto 0;flex:0 0 auto}
.planet-frame{display:block;position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#101c32;mask-image:radial-gradient(circle at center,#000 54%,rgba(0,0,0,.94) 65%,transparent 76%);-webkit-mask-image:radial-gradient(circle at center,#000 54%,rgba(0,0,0,.94) 65%,transparent 76%)}
.globe-interaction{position:absolute;inset:0;z-index:2;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;border-radius:50%}
.globe-interaction:active{cursor:grabbing}
.globe-interaction:focus-visible{outline:2px solid #e6c88d;outline-offset:-4px}
.planet-fallback{display:grid;place-items:center;position:absolute;inset:22%;border:1px solid #456267;border-radius:50%;background:radial-gradient(circle at 35% 28%,#4e8575,#244954 66%,#112631);box-shadow:inset -22px -28px 30px #091d27b0;z-index:0}
.planet-fallback::after{content:"";width:76%;height:76%;border:1px solid #a4beada3;border-radius:50%;transform:rotate(-24deg) scaleY(.5)}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:-3px;position:relative;z-index:3;width:100%}
.actions a{display:inline-flex;justify-content:center;align-items:center;min-width:174px;min-height:52px;padding:13px 25px;border-radius:6px;font-weight:650;font-size:14px;letter-spacing:.015em;text-decoration:none;transition:transform .15s,background .15s;border:1px solid #bda57a}
.actions a:focus-visible{outline:3px solid #edca84;outline-offset:3px}
.actions a:hover{transform:translateY(-2px)}
.play{color:#142322;background:#e3c68f}
.atlas{background:#152932;color:#e8d9b7;border-color:#5d726f!important}
.release{position:fixed;z-index:5;right:max(18px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;pointer-events:none;font:500 11px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:.10em;color:#a6b3af;opacity:.49}
.release span+span::before{content:"·";margin-right:8px}

@media(max-width:640px){
 main{justify-content:center;padding-top:30px}
 h1{font-size:clamp(33px,9.3vw,52px);letter-spacing:0}
 .planet-wrap{width:min(95vw, min(54dvh,510px));margin:8px auto 3px}
 .actions{gap:10px}
 .actions a{min-width:142px;flex:1 1 40%;max-width:205px;padding:11px 12px;min-height:50px}
 .release{font-size:10px;right:max(13px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom))}
}
@media(max-height:620px) and (orientation:landscape){
 main{padding:10px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:auto auto auto;align-content:center;column-gap:12px}
 h1{grid-column:1;grid-row:1;font-size:clamp(29px,5vw,44px)}
 .planet-wrap{grid-column:2;grid-row:1/4;width:min(70dvh,420px);margin:auto}
 .actions{grid-column:1;grid-row:2;margin-top:18px}
 .actions a{min-width:120px;flex:1 1 140px}
 .release{position:fixed;right:10px;bottom:7px}
}
@media(prefers-reduced-motion:reduce){.actions a{transition:none}}
</style>
</head>
<body>
<main>
 <div class="ambient-landscape" aria-hidden="true">
   <svg viewBox="0 0 1440 350" preserveAspectRatio="none" focusable="false">
    <path class="ridge-far" d="M0 245 94 210 178 230 287 140 379 217 464 181 552 244 645 147 714 194 795 120 892 223 975 173 1061 221 1155 117 1266 234 1361 185 1440 220V350H0Z"/>
    <path class="ridge-near" d="M0 276 122 249 208 281 300 225 373 287 466 261 535 296 638 229 726 294 839 255 919 302 1015 242 1111 294 1202 259 1312 290 1440 251V350H0Z"/>
    <path class="treeline" d="M0 350V297l28-11 8-32 8 33 23 12 26-7 8-42 9 43 40-10 13-30 10 30 42 5 9-36 10 38 36 2 10-31 12 32 30-9 7-29 9 32 40 4 13-31 11 28 37 7 13-34 11 37 49-5 10-28 10 30 32-5 9-36 12 39 42-7 13-26 11 30 42 2 9-31 9 29 33-9 12-25 12 28 40 5 11-37 10 36 47-2 10-30 10 31 38-5 11-28 9 30 38-7 12-39 11 38 41-5 9-25 11 25 35-6 12-32 13 36 46-9 12-34 12 34 35-2 11-27 11 31 48-5 10-26 8 25 54-8 12-36 11 34 36-7 9-32 9 33 40-5 12-33 9 35 50-6 10-28 11 27 39-5v71Z"/>
   </svg>
 </div>
 <h1>NexGameWorld</h1>
 <div class="planet-wrap" aria-label="Интерактивный обзор планеты из игры NexGameWorld">
   <div class="planet-fallback" aria-hidden="true"></div>
   <iframe class="planet-frame" id="planet" title="Актуальная планета NexGameWorld из сферической игры" loading="eager" sandbox="allow-scripts allow-same-origin" tabindex="-1" aria-hidden="true"></iframe>
   <div class="globe-interaction" id="rotate" role="application" tabindex="0" aria-label="Вращать планету пальцем, мышью или стрелками клавиатуры"></div>
 </div>
 <nav class="actions" aria-label="Основные разделы">
  <a class="play" href="/nexgameworld/">Войти в мир</a>
  <a class="atlas" href="/atlas">Открыть Атлас</a>
 </nav>
</main>
<footer class="release" aria-label="Статус и актуальная версия NexGameWorld">
 <span>ALPHA</span><span id="buildVersion" aria-live="polite">Версия —</span>
</footer>
<script>
(()=>{
 'use strict';
 const frame=document.getElementById('planet');
 const versionLabel=document.getElementById('buildVersion');
 const versionSources=[
   './nexgameworld/planet-test/version.json',
   'https://nexions-link.github.io/Nexgame/planet-test/version.json',
   'https://raw.githubusercontent.com/Nexions-link/Nexgame/main/planet-test/version.json'
 ];
 let versionChecking=false;
 async function refreshGameVersion(){
   if(versionChecking)return;
   versionChecking=true;
   try{
     for(const source of versionSources){
       try{
         const url=source+(source.includes('?')?'&':'?')+'_='+Date.now();
         const response=await fetch(url,{cache:'no-store',mode:'cors'});
         if(!response.ok)continue;
         const release=await response.json();
         if(release.project!=='NexGameWorld'||typeof release.version!=='string'||!/^\d+\.\d+\.\d+$/.test(release.version))continue;
         versionLabel.textContent=release.version;
         versionLabel.title='Текущая опубликованная версия игры: '+release.version;
         return;
       }catch(err){console.warn('NexGameWorld version source unavailable:',source,err)}
     }
     versionLabel.title='Не удалось получить номер версии игры';
   }finally{versionChecking=false}
 }
 void refreshGameVersion();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)void refreshGameVersion()});
 window.addEventListener('pageshow',()=>void refreshGameVersion());
 window.setInterval(()=>{if(!document.hidden)void refreshGameVersion()},60000);
 const surface=document.getElementById('rotate');
 // Force a fresh game index; the game itself versions all changed modules.
 frame.src='https://nexions-link.github.io/Nexgame/planet-test/?portal-preview=1&fresh='+Date.now();
 const points=new Map();
 let prevPinch=0;
 const send=(action,params={})=>{
   if(!frame.contentWindow)return;
   frame.contentWindow.postMessage({type:'nexgameworld-globe',action,...params},'https://nexions-link.github.io');
 };
 const distance=()=>{const [a,b]=[...points.values()];return a&&b?Math.hypot(a.x-b.x,a.y-b.y):0};
 surface.addEventListener('pointerdown',event=>{
   if(event.pointerType==='mouse'&&event.button!==0)return;
   event.preventDefault();
   points.set(event.pointerId,{x:event.clientX,y:event.clientY});
   try{surface.setPointerCapture(event.pointerId)}catch{}
   prevPinch=points.size===2?distance():0;
 });
 surface.addEventListener('pointermove',event=>{
   const old=points.get(event.pointerId);
   if(!old)return;
   event.preventDefault();
   points.set(event.pointerId,{x:event.clientX,y:event.clientY});
   if(points.size===1){
     const dx=event.clientX-old.x,dy=event.clientY-old.y;
     if(Math.abs(dx)+Math.abs(dy)>.1)send('drag',{dx,dy});
   }else if(points.size===2){
     const next=distance();
     if(prevPinch>0&&next>10)send('zoom',{ratio:Math.max(.66,Math.min(1.49,prevPinch/next))});
     prevPinch=next;
   }
 });
 const release=event=>{points.delete(event.pointerId);prevPinch=0};
 surface.addEventListener('pointerup',release);
 surface.addEventListener('pointercancel',release);
 surface.addEventListener('lostpointercapture',release);
 surface.addEventListener('wheel',event=>{
   event.preventDefault();
   send('zoom',{ratio:Math.exp(Math.max(-120,Math.min(120,event.deltaY))*.002)});
 },{passive:false});
 surface.addEventListener('keydown',event=>{
   const map={ArrowLeft:[24,0],ArrowRight:[-24,0],ArrowUp:[0,-24],ArrowDown:[0,24]};
   if(!map[event.key])return;
   event.preventDefault();
   send('drag',{dx:map[event.key][0],dy:map[event.key][1]});
 });
})();
</script>
</body>
